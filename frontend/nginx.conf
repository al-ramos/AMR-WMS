server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Health check do ALB / docker — responde sem depender da API.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api para o container da API (docker-compose local).
    # Em producao no ECS o ALB roteia /api/* direto para o servico de API e este
    # bloco nunca e atingido — mas o nginx resolve o upstream no boot. Sem o
    # resolver + variavel, o container nao sobe quando o host "api" nao existe.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
