services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5188:8080"
    volumes:
      - wms_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AmrWms=Data Source=/data/amr_wms.db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5177:80"
    depends_on:
      - api

volumes:
  wms_data:
